services:
  hexapod:
    build: 
      context: .
      args:
        ROS_IMAGE: osrf/ros:jazzy-desktop-full
        INSTALL_DEV_TOOLS: true
    container_name: hexapod_ros2_dev
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./src:/hexapod_ws/src
      # Bind-mounted (not a device mapping) so controllers attached after start still appear
      - /dev/input:/dev/input
      # WSL sets X11_SOCKET_DIR=/mnt/wslg/.X11-unix in .env
      - ${X11_SOCKET_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    command: bash