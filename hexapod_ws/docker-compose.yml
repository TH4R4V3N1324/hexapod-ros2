services:
  hexapod:
    build: .
    container_name: hexapod_ros2
    restart: unless-stopped
    network_mode: host
    privileged: true
    # Ahead of everything else on the Pi for CPU, notably the image rebuild pi/update.sh runs while
    # the old container keeps going: it ran alongside the robot and made control lag
    cpu_shares: 8192
    volumes:
      # Host /dev, so udev symlinks (/dev/rplidar) and devices plugged in after start are visible
      - /dev:/dev
      # The host's udev database, which SDL (game_controller_node) reads to tell which input
      # devices are gamepads and to notice one being plugged in or paired after start
      - /run/udev:/run/udev:ro
