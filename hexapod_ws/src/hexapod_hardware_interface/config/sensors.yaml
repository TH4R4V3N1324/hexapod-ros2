ism330dhcx:
  ros__parameters:
    i2c_bus: /dev/i2c-1
    address: 106             # 0x6A (107 = 0x6B if the address jumper is bridged)
    frame_id: imu_link
    accel_range_g: 8         # 2, 4, 8 or 16
    gyro_range_dps: 1000     # 125, 250, 500, 1000, 2000 or 4000
    rate: 100.0              # the chip's output rate is set to the next step up (104 Hz)

imu_filter:
  ros__parameters:
    use_mag: false
    publish_tf: false
    world_frame: enu

ina226:
  ros__parameters:
    i2c_bus: /dev/i2c-1
    addresses: [64, 65]               # 0x40 (A0 jumper open), 0x41 (A0 jumper bridged)
    locations: [left, right]
    shunt_resistances: [0.002, 0.002] # ohms, R1 on each daughter board (2 mΩ)
    battery_full_voltage: 12.6    # 3S LiPo, 4.2 V/cell
    battery_empty_voltage: 9.0    # 3.0 V/cell
    rate: 10.0

# Leg hubs' SERVO_EN (J7 pin 4), switched as one
servo_power:
  ros__parameters:
    gpio_chip: /dev/gpiochip0   # Pi 5, kernel 6.6.45 or newer (gpiochip4 on older kernels)
    gpio_lines: [17]            # BCM GPIO numbers: one shared line, or one per leg hub. Use GPIO9-27 (pulled down at boot)

# Servo health from ST3215System's temperature/voltage/current/servo_error state interfaces
servo_monitor:
  ros__parameters:
    temperature_warn: 55.0          # °C
    temperature_error: 65.0         # °C; the servos turn themselves off at 70 °C (max_temperature)
    voltage_drop_warn: 1.0          # V below the best-supplied servo: a bad connection
    stale_timeout: 2.0              # s without /dynamic_joint_states before it's reported stale
    diagnostics_rate: 1.0           # Hz
    joint_states_rate: 10.0         # Hz, joint_states/throttled (effort to plot)
    dynamic_joint_states_rate: 2.0  # Hz, dynamic_joint_states/throttled (temperature etc. to plot)

# RPLIDAR A2M12 (Slamtec rplidar_ros driver)
rplidar:
  ros__parameters:
    serial_port: /dev/rplidar      # udev symlink, see hexapod_ws/udev/99-rplidar.rules
    serial_baudrate: 256000        # A2M12; the older A2M8 uses 115200
    frame_id: lidar_link
    angle_compensate: true
    inverted: false                # true if the lidar is mounted upside down
