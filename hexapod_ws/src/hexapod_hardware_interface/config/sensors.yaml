ism330dhcx:
  ros__parameters:
    i2c_bus: /dev/i2c-1
    address: 106             # 0x6A (107 = 0x6B if the address jumper is bridged)
    frame_id: imu_link
    accel_range_g: 8         # 2, 4, 8 or 16
    gyro_range_dps: 1000     # 125, 250, 500, 1000, 2000 or 4000
    rate: 100.0              # the chip's output rate is set to the next step up (104 Hz)

imu_filter:
  ros__parameters:
    use_mag: false
    publish_tf: false
    world_frame: enu

ina226:
  ros__parameters:
    i2c_bus: /dev/i2c-1
    addresses: [64, 65]               # 0x40 (A0 jumper open), 0x41 (A0 jumper bridged)
    locations: [left, right]
    shunt_resistances: [0.002, 0.002] # ohms, R1 on each daughter board (2 mΩ)
    battery_full_voltage: 12.6    # 3S LiPo, 4.2 V/cell
    battery_empty_voltage: 9.0    # 3.0 V/cell
    rate: 10.0

# RPLIDAR A2M12 (Slamtec rplidar_ros driver)
rplidar:
  ros__parameters:
    serial_port: /dev/rplidar      # udev symlink, see hexapod_ws/udev/99-rplidar.rules
    serial_baudrate: 256000        # A2M12; the older A2M8 uses 115200
    frame_id: lidar_link
    angle_compensate: true
    inverted: false                # true if the lidar is mounted upside down
