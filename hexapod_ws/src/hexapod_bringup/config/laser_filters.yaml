# Removes the robot's own legs from the lidar scan: /lidar/scan in, /lidar/scan_filtered out
# (laser_filters scan_to_scan_filter_chain). The lidar sits on the lid, centred, with its scan
# plane 6.7 cm above the hips, so the legs cross it. The knees and the outer curve of the tibias
# reach ~0.345 m from the centre, so everything nearer than 0.38 m is dropped. Dropped returns
# become NaN ("no reading") rather than +inf, since a leg hides whatever is behind it; nothing
# real can be that close anyway, inside Nav2's robot_radius (0.39 m).
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: legs
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.38
        upper_threshold: 100.0
        lower_replacement_value: .nan
        upper_replacement_value: .inf
