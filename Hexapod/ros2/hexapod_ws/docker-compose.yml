version: "3.9"

services:
  hexapod:
    build: .
    container_name: hexapod_ros2
    command: tail -f /dev/null
    volumes:
      - .:/hexapod_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/hexapod_ws/src
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    stdin_open: true
    tty: true